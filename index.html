<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe</title>
    <link rel="icon" href="tic-tac-toe-game-svgrepo-com.svg" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1>Tic-Tac-Toe</h1>
        <p class="status" aria-live="polite">Player 1's turn</p>
      </header>

      <div
        class="gridContainer"
        role="grid"
        aria-label="Tic-Tac-Toe board"
      ></div>

      <button id="reset" class="reset-btn" type="button">Restart</button>
    </main>
  </body>
</html>
